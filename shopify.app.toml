# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6835deda5318805f4a8458a50142303a"
name = "nyle-app"
handle = "nyle-app"
application_url = "https://initiated-stones-tba-pda.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_checkouts,write_checkouts,read_content,write_content,read_customers,write_customers,read_discounts,write_discounts,read_draft_orders,write_draft_orders,read_fulfillments,write_fulfillments,read_gift_cards,write_gift_cards,read_inventory,write_inventory,read_locales,read_locations,write_locations,read_marketing_events,write_marketing_events,read_online_store_navigation,write_online_store_navigation,read_orders,write_orders,read_price_rules,write_price_rules,read_products,write_products,read_product_listings,read_reports,write_reports,read_resource_feedbacks,write_resource_feedbacks,read_script_tags,write_script_tags,read_shipping,write_shipping,read_shopify_payments_payouts,read_shopify_payments_disputes,read_themes,write_themes,read_third_party_fulfillment_orders,write_third_party_fulfillment_orders,read_translations,write_translations"


[auth]
redirect_urls = [
  "https://initiated-stones-tba-pda.trycloudflare.com/auth/callback",
  "https://initiated-stones-tba-pda.trycloudflare.com/auth/shopify/callback",
  "https://initiated-stones-tba-pda.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false
