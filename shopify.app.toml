# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6835deda5318805f4a8458a50142303a"
name = "nyle-app"
handle = "nyle-app"
application_url = "https://cry-frame-tulsa-anytime.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[auth]
redirect_urls = [
  "https://cry-frame-tulsa-anytime.trycloudflare.com/auth/callback",
  "https://cry-frame-tulsa-anytime.trycloudflare.com/auth/shopify/callback",
  "https://cry-frame-tulsa-anytime.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false
